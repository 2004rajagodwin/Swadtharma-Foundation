   <!-- brudcrum section  start-->
 <section
    class="swf-breadcrumb-banner"
    role="region"
    aria-labelledby="breadcrumb-heading"
    style="background-image: url(images/aboutus-brudcrum.webp);">

    <!-- Background Image -->

    <div class="swf-breadcrumb-container">

        <!-- Breadcrumb Navigation -->
        <nav
            class="swf-breadcrumb-nav"
            aria-label="Breadcrumb Navigation">

</section>
<!-- Breadcrumb Banner Section -->

    <section
    class="swat-team-section"
    role="region"
    aria-labelledby="swat-team-heading">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8 text-center">

               

                <h2
                    id="swat-team-heading"
                    class="swat-team-title">

                    Meet The People Behind Our Mission

                </h2>

                <p class="swat-team-description">

                    Dedicated individuals working together to empower
                    communities and create meaningful social impact.

                </p>

            </div>

        </div>

        <div
            class="row g-4 mt-4"
            role="list"
            aria-label="Swadharma Foundation Team Members">

            <!-- Card 1 -->
            <div class="col-lg-3 col-md-6" role="listitem">

                <article
                    class="swat-team-card"
                    tabindex="0"
                    role="group"
                    aria-labelledby="team-member-1-name"
                    aria-describedby="team-member-1-role">

                    <img
                        src="images/team-img.png"
                        alt="Photograph of Joseph Anderson"
                        class="swat-team-image img-fluid">

                    <div class="swat-team-content">

                        <h3
                            id="team-member-1-name"
                            class="swat-team-name">

                          Mathan 

                        </h3>

                        <p
                            id="team-member-1-role"
                            class="swat-team-role">

                           Manager

                        </p>

                    </div>

                </article>

            </div>

            <!-- Card 2 -->
            <div class="col-lg-3 col-md-6" role="listitem">

                <article
                    class="swat-team-card"
                    tabindex="0"
                    role="group"
                    aria-labelledby="team-member-2-name"
                    aria-describedby="team-member-2-role">

                    <img
                        src="images/c1.png"
                        alt="Photograph of Sarah Taylor"
                        class="swat-team-image img-fluid">

                    <div class="swat-team-content">

                        <h3
                            id="team-member-2-name"
                            class="swat-team-name">

                          Vignesh 

                        </h3>

                        <p
                            id="team-member-2-role"
                            class="swat-team-role">

                           Team Organizer

                        </p>

                    </div>

                </article>

            </div>

            <!-- Card 3 -->
            <div class="col-lg-3 col-md-6" role="listitem">

                <article
                    class="swat-team-card"
                    tabindex="0"
                    role="group"
                    aria-labelledby="team-member-3-name"
                    aria-describedby="team-member-3-role">

                    <img
                        src="images/team-img.png"
                        alt="Photograph of David Davis"
                        class="swat-team-image img-fluid">

                    <div class="swat-team-content">

                        <h3
                            id="team-member-3-name"
                            class="swat-team-name">

                           Gnanam

                        </h3>

                        <p
                            id="team-member-3-role"
                            class="swat-team-role">

                       Team Organizer
                        </p>

                    </div>

                </article>

            </div>
